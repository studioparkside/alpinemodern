<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Alpine Modern — Project index</title>
<style>
body{background:#F1F1F0;color:#141414;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
  font-size:19px;line-height:1.55;padding:60px 28px;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;margin:0}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:0 0 6px}
.sub{font-size:16px;color:#6A6A6A;font-weight:600;margin:0 0 38px}
a{color:inherit;text-decoration:none}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:20px;align-items:baseline;
  padding:20px 0;border-top:1px solid rgba(20,20,20,.13)}
.row:first-of-type{border-top:1px solid rgba(20,20,20,.82)}
.row:hover{border-top-color:rgba(20,20,20,.82)}
.n{font-size:26px;font-variant-numeric:tabular-nums;color:#141414}
.t{font-size:21px;font-weight:700;letter-spacing:-.02em}
.d{font-size:16px;color:#6A6A6A;margin-top:3px}
.arw{font-size:16px;color:#6A6A6A}
@media(prefers-color-scheme:dark){
  body{background:#0E0F10;color:#fff}
  .sub,.d,.arw{color:#94979A}
  .n{color:#fff}
  .row{border-top-color:rgba(255,255,255,.18)}
  .row:first-of-type,.row:hover{border-top-color:rgba(255,255,255,.8)}
}
</style>
</head>
<body>
<div class="wrap">
<h1>Alpine Modern</h1>
<p class="sub">Café collateral and coffee packaging</p>
<a class="row" href="cafe/round-2/">
  <span class="n">01</span>
  <span><span class="t">Round 2 artwork</span><span class="d">Artwork and color for every deliverable</span></span>
  <span class="arw">&#8599;</span>
</a>
</div>
</body></html>
